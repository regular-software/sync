name: Publish

on:
  push:
    tags: ["sync-v*"]

concurrency:
  group: sync-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release:check
      - run: pnpm package:smoke
      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          for package in protocol sync indexeddb browser server hono drizzle react-query; do
            npm publish "packages/$package" --access public
          done
